name: Backend CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  checks:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: workspace/ambrogio-backend
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      # ambrogio-model holds the workspace scripts: clone it as checkout-workspace does,
      # on the branch with the same name when it exists, otherwise on main.
      - name: Check out ambrogio-model
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/ambrogio-app/ambrogio-model.git"
          ref=main
          if [ -n "$BRANCH" ] && git ls-remote --exit-code --heads "$url" "$BRANCH" >/dev/null; then ref="$BRANCH"; fi
          git clone --quiet --branch "$ref" "$url" workspace/ambrogio-model
          echo "ambrogio-model: $ref" >&2

      - name: Check out the other repositories side by side
        run: workspace/ambrogio-model/scripts/checkout-workspace workspace "$BRANCH"

      - name: Check the model of the workspace
        run: workspace/ambrogio-model/scripts/model-checks --workspace workspace

      - name: Install pnpm
        run: npm install --global pnpm@12.11.2

      - name: Install dependencies
        working-directory: workspace/ambrogio-backend
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        working-directory: workspace/ambrogio-backend
        run: pnpm typecheck

      # The workspace packages export their compiled dist/, so tests need the build first.
      - name: Build
        working-directory: workspace/ambrogio-backend
        run: pnpm build

      # The test suite exercises the pre-commit hook, which needs gitleaks on PATH.
      - name: Install verified gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run tests
        working-directory: workspace/ambrogio-backend
        run: pnpm test
