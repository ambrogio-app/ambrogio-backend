name: Backend CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  checks:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@12.11.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Reqvire model
        run: npx --yes @reqvire-org/reqvire@1.3.2 --workspace "$PWD" validate

      - name: Lint Reqvire model
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/reqvire-lint.json"
          npx --yes @reqvire-org/reqvire@1.3.2 --workspace "$PWD" lint --json > "$report"
          cat "$report"
          jq -e '.auto_fixable == [] and .needs_manual_review == []' "$report"

      - name: Check model integrity
        run: node scripts/check-model.mjs

      - name: Check TypeScript
        run: pnpm typecheck

      # The workspace packages export their compiled dist/, so tests need the build first.
      - name: Build
        run: pnpm build

      # The test suite exercises the pre-commit hook, which needs gitleaks on PATH.
      - name: Install verified gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run tests
        run: pnpm test
