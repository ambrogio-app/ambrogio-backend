services:
  backend:
    image: ghcr.io/ambrogio-app/ambrogio-backend:${AMBROGIO_VERSION:?Set AMBROGIO_VERSION}
    ports:
      - "${AMBROGIO_HTTP_PORT:-3000}:${AMBROGIO_HTTP_PORT:-3000}"
    volumes:
      - ./examples/http.ts:/etc/ambrogio/http.ts:ro
      - ./examples/conversations.ts:/etc/ambrogio/conversations.ts:ro
      - ./examples/voice.ts:/etc/ambrogio/voice.ts:ro
      - ./examples/agents/orchestrator.ts:/etc/ambrogio/agents/orchestrator.ts:ro
      - ./examples/agents/generic.ts:/etc/ambrogio/agents/generic.ts:ro
      - conversations:/data
    environment:
      AMBROGIO_HTTP_CONFIG_PATH: /etc/ambrogio/http.ts
      AMBROGIO_CONVERSATIONS_CONFIG_PATH: /etc/ambrogio/conversations.ts
      AMBROGIO_VOICE_CONFIG_PATH: /etc/ambrogio/voice.ts
      AMBROGIO_HTTP_HOST: 0.0.0.0
      AMBROGIO_HTTP_PORT: ${AMBROGIO_HTTP_PORT:-3000}
      AMBROGIO_ALLOWED_ORIGINS: ${AMBROGIO_ALLOWED_ORIGINS:-}
      AMBROGIO_PUBLIC_HTTPS: ${AMBROGIO_PUBLIC_HTTPS:-false}
      AMBROGIO_HSTS_MAX_AGE_SECONDS: ${AMBROGIO_HSTS_MAX_AGE_SECONDS:-}
      AMBROGIO_ARCHIVE_PATH: ${AMBROGIO_ARCHIVE_PATH:-/data/conversations.sqlite}
      AMBROGIO_LANGUAGE: ${AMBROGIO_LANGUAGE:-en}
      AMBROGIO_TIME_ZONE: ${AMBROGIO_TIME_ZONE:-UTC}
      AMBROGIO_LIST_PAGE_SIZE: ${AMBROGIO_LIST_PAGE_SIZE:-20}
      AMBROGIO_MAX_LIST_PAGE_SIZE: ${AMBROGIO_MAX_LIST_PAGE_SIZE:-100}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      AMBROGIO_ORCHESTRATOR_PROVIDER: ${AMBROGIO_ORCHESTRATOR_PROVIDER:-mistral}
      AMBROGIO_ORCHESTRATOR_MODEL: ${AMBROGIO_ORCHESTRATOR_MODEL:-mistral-medium-latest}
      AMBROGIO_ORCHESTRATOR_API_KEY: ${AMBROGIO_ORCHESTRATOR_API_KEY:-}
      AMBROGIO_ORCHESTRATOR_BASE_URL: ${AMBROGIO_ORCHESTRATOR_BASE_URL:-}
      AMBROGIO_ORCHESTRATOR_INSTRUCTIONS: ${AMBROGIO_ORCHESTRATOR_INSTRUCTIONS:-}
      AMBROGIO_ORCHESTRATOR_TEMPERATURE: ${AMBROGIO_ORCHESTRATOR_TEMPERATURE:-}
      AMBROGIO_ORCHESTRATOR_MAX_TOKENS: ${AMBROGIO_ORCHESTRATOR_MAX_TOKENS:-}
      AMBROGIO_GENERIC_PROVIDER: ${AMBROGIO_GENERIC_PROVIDER:-mistral}
      AMBROGIO_GENERIC_MODEL: ${AMBROGIO_GENERIC_MODEL:-mistral-medium-latest}
      AMBROGIO_GENERIC_API_KEY: ${AMBROGIO_GENERIC_API_KEY:-}
      AMBROGIO_GENERIC_BASE_URL: ${AMBROGIO_GENERIC_BASE_URL:-}
      AMBROGIO_GENERIC_DESCRIPTION: ${AMBROGIO_GENERIC_DESCRIPTION:-}
      AMBROGIO_GENERIC_INSTRUCTIONS: ${AMBROGIO_GENERIC_INSTRUCTIONS:-}
      AMBROGIO_GENERIC_TEMPERATURE: ${AMBROGIO_GENERIC_TEMPERATURE:-}
      AMBROGIO_GENERIC_MAX_TOKENS: ${AMBROGIO_GENERIC_MAX_TOKENS:-}
      AMBROGIO_IT_VOICE_ENGINE: ${AMBROGIO_IT_VOICE_ENGINE:-piper}
      AMBROGIO_IT_VOSK_MODEL_PATH: ${AMBROGIO_IT_VOSK_MODEL_PATH:-}
      AMBROGIO_IT_VOICE_MODEL_DIR: ${AMBROGIO_IT_VOICE_MODEL_DIR:-}
      AMBROGIO_IT_VOICE_SPEAKER: ${AMBROGIO_IT_VOICE_SPEAKER:-}
      AMBROGIO_IT_VOICE_LANGUAGE: ${AMBROGIO_IT_VOICE_LANGUAGE:-}
      AMBROGIO_EN_VOICE_ENGINE: ${AMBROGIO_EN_VOICE_ENGINE:-piper}
      AMBROGIO_EN_VOSK_MODEL_PATH: ${AMBROGIO_EN_VOSK_MODEL_PATH:-}
      AMBROGIO_EN_VOICE_MODEL_DIR: ${AMBROGIO_EN_VOICE_MODEL_DIR:-}
      AMBROGIO_EN_VOICE_SPEAKER: ${AMBROGIO_EN_VOICE_SPEAKER:-}
      AMBROGIO_EN_VOICE_LANGUAGE: ${AMBROGIO_EN_VOICE_LANGUAGE:-}

volumes:
  conversations:
