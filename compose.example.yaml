# Example deployment of the backend. Set AMBROGIO_VERSION and MISTRAL_API_KEY in the shell or in a
# .env file next to this file before `docker compose up`. The variables below are the ones production
# requires; every other variable keeps the default the server applies (see the configuration reference).
services:
  backend:
    image: ghcr.io/ambrogio-app/ambrogio-backend:${AMBROGIO_VERSION:?Set AMBROGIO_VERSION}
    # The backend ends its own shutdown within 10 seconds; give it longer before Docker sends SIGKILL.
    stop_grace_period: 15s
    ports:
      - "3000:3000"
    volumes:
      - ./examples/agents/orchestrator.json:/etc/ambrogio/agents/orchestrator.json:ro
      - ./examples/agents/generic.json:/etc/ambrogio/agents/generic.json:ro
      - conversations:/data
    environment:
      AMBROGIO_ENV: production
      AMBROGIO_HTTP_HOST: 0.0.0.0
      AMBROGIO_HTTP_PORT: "3000"
      AMBROGIO_PUBLIC_HTTPS: "false"
      AMBROGIO_ARCHIVE_PATH: /data/conversations.sqlite
      AMBROGIO_VOICE_LANGUAGES: en,it
      AMBROGIO_VOICE_EN_VOSK_MODEL_PATH: /opt/ambrogio/models/vosk-model-small-en-us-0.15
      AMBROGIO_VOICE_EN_ENGINE: piper
      AMBROGIO_VOICE_EN_MODEL_DIR: /opt/ambrogio/voices/vits-piper-en_US-kristin-medium
      AMBROGIO_VOICE_IT_VOSK_MODEL_PATH: /opt/ambrogio/models/vosk-model-small-it-0.22
      AMBROGIO_VOICE_IT_ENGINE: piper
      AMBROGIO_VOICE_IT_MODEL_DIR: /opt/ambrogio/voices/vits-piper-it_IT-paola-medium
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:?Set MISTRAL_API_KEY}

volumes:
  conversations:
